name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '14.15.0'

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build -- --configuration production --base-href=/ng-prac/

      - name: Add 404 Fallback for Routing
        run: cp dist/ng-prac/index.html dist/ng-prac/404.html

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist/ng-prac
          branch: gh-pages
